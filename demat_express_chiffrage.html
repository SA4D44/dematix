<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chiffrage rapide DEMAT Express</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: Arial, sans-serif; font-size: 14px; color: #1a1a1a; background: #fff; }
.header { padding: 1.25rem 1.25rem 0.5rem; border-bottom: 1px solid #eee; display: flex; align-items: center; gap: 14px; }
.badge { display: inline-block; background: #E6F1FB; color: #0C447C; font-size: 12px; padding: 3px 10px; border-radius: 99px; font-weight: 600; }
h1 { font-size: 20px; font-weight: 700; color: #1a1a1a; margin-bottom: 2px; }
.subtitle { font-size: 13px; color: #666; }
.main { display: flex; min-height: calc(100vh - 70px); }
.panel { width: 390px; flex-shrink: 0; border-right: 1px solid #eee; overflow-y: auto; }
.map-side { flex: 1; display: flex; flex-direction: column; }
#map { flex: 1; min-height: 500px; }
.section { padding: 0.85rem 1rem; border-bottom: 1px solid #eee; }
.label { font-size: 11px; color: #555; margin-bottom: 5px; display: block; font-weight: 700; text-transform: uppercase; letter-spacing: 0.4px; }
select, input[type=text], input[type=number] {
  width: 100%; height: 36px; padding: 0 10px;
  border: 1px solid #ccc; border-radius: 6px;
  background: #fff; color: #1a1a1a;
  font-size: 14px; font-family: Arial, sans-serif;
}
select:focus, input:focus { outline: 2px solid #185FA5; border-color: #185FA5; }
.agence-info { font-size: 12px; color: #185FA5; margin-top: 5px; padding: 4px 8px; background: #f0f7ff; border-radius: 4px; display: none; }
.stop-list { margin-bottom: 8px; }
.stop-input-wrap { display: flex; gap: 6px; align-items: center; margin-bottom: 6px; }
.stop-num { width: 22px; height: 22px; border-radius: 50%; background: #185FA5; color: #fff; font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.btn-sm { height: 34px; padding: 0 12px; border: 1px solid #ccc; border-radius: 6px; background: #fff; color: #1a1a1a; font-size: 13px; cursor: pointer; display: inline-flex; align-items: center; gap: 5px; font-family: Arial, sans-serif; }
.btn-sm:hover { background: #f5f5f5; }
.btn-primary { background: #185FA5; color: #fff; border: none; font-size: 14px; font-weight: 700; height: 42px; padding: 0 20px; border-radius: 6px; cursor: pointer; font-family: Arial, sans-serif; width: 100%; margin-top: 4px; }
.btn-primary:hover { background: #0C447C; }
.btn-del { width: 28px; height: 28px; border: none; background: none; cursor: pointer; color: #999; font-size: 18px; display: flex; align-items: center; justify-content: center; border-radius: 4px; flex-shrink: 0; }
.btn-del:hover { background: #fee; color: #c0392b; }
.peage-row { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
.switch { position: relative; display: inline-block; width: 42px; height: 22px; flex-shrink: 0; }
.switch input { opacity: 0; width: 0; height: 0; }
.slider-sw { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background: #ccc; border-radius: 22px; transition: 0.2s; }
.slider-sw:before { position: absolute; content: ""; height: 16px; width: 16px; left: 3px; bottom: 3px; background: white; border-radius: 50%; transition: 0.2s; }
input:checked + .slider-sw { background: #185FA5; }
input:checked + .slider-sw:before { transform: translateX(20px); }
#peage-section { display: none; margin-top: 8px; }
.client-info { font-size: 12px; margin-top: 5px; padding: 5px 8px; border-radius: 4px; display: none; }
.client-info.loxam { background: #fff8e6; color: #9a6000; border: 1px solid #f0d080; }
.client-info.standard { background: #f0fff4; color: #1a6b34; border: 1px solid #a8d8b8; }
.result-card { background: #f0f7ff; border-radius: 8px; padding: 1rem; border: 1px solid #b8d4f0; display: none; }
.result-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 10px; }
.metric { background: #fff; border-radius: 6px; padding: 10px; border: 1px solid #dde8f5; }
.metric-label { font-size: 11px; color: #888; margin-bottom: 3px; font-weight: 700; text-transform: uppercase; }
.metric-value { font-size: 18px; font-weight: 700; color: #1a1a1a; }
.total-row { display: flex; justify-content: space-between; align-items: center; border-top: 1px solid #b8d4f0; padding-top: 10px; }
.total-label { font-size: 14px; font-weight: 700; color: #1a1a1a; }
.total-value { font-size: 26px; font-weight: 700; color: #185FA5; }
.loading { text-align: center; padding: 12px; font-size: 13px; color: #185FA5; display: none; background: #e8f2fc; border-radius: 6px; }
.error { color: #c0392b; font-size: 13px; padding: 10px; background: #fdf0f0; border-radius: 6px; display: none; border: 1px solid #f5c6cb; }
.map-info { background: #f0f7ff; border-top: 1px solid #b8d4f0; padding: 8px 14px; font-size: 12px; color: #185FA5; display: none; font-weight: 600; }
</style>
</head>
<body>

<div class="header">
  <div>
    <div style="margin-bottom:4px;"><span class="badge">DEMAT Express</span></div>
    <h1>Chiffrage rapide</h1>
    <p class="subtitle">Calcul automatique de la distance, de l'itineraire et du prix</p>
  </div>
</div>

<div class="main">
  <!-- PANNEAU GAUCHE -->
  <div class="panel">

    <div class="section">
      <label class="label">Agence de depart</label>
      <select id="agence" onchange="onAgenceChange()">
        <option value="">-- Selectionner une agence --</option>
        <option value="Pommérieux, Mayenne, France">Laval (depart : Pommérieux)</option>
        <option value="Vigneux-de-Bretagne, Loire-Atlantique, France">Nantes (depart : Vigneux-de-Bretagne)</option>
        <option value="Brest, Finistère, France">Brest (depart : Brest)</option>
      </select>
      <div class="agence-info" id="agence-info"></div>
    </div>

    <div class="section">
      <label class="label">Client</label>
      <select id="client" onchange="onClientChange()">
        <option value="standard">Client standard -- 0,95 euro/km</option>
        <option value="loxam">Loxam -- 1,25 euro/km (peage inclus)</option>
      </select>
      <div class="client-info standard" id="client-info">Tarif 0,95 euro/km &mdash; peage en sus si applicable</div>
    </div>

    <div class="section">
      <label class="label">Carburant</label>
      <div style="display:flex; gap:10px;">
        <div style="flex:1;">
          <label class="label" style="margin-top:0;">Consommation (L/100 km)</label>
          <input type="number" id="conso" value="9" min="1" max="50" step="0.1">
        </div>
        <div style="flex:1;">
          <label class="label" style="margin-top:0;">Prix carburant (€/L)</label>
          <input type="number" id="prix-carburant" value="1.95" min="0.5" max="5" step="0.01">
        </div>
      </div>
    </div>

    <div class="section" id="peage-wrapper">
      <div class="peage-row">
        <label class="switch">
          <input type="checkbox" id="peage-toggle" onchange="togglePeage()">
          <span class="slider-sw"></span>
        </label>
        <span style="font-size:14px;">Peage autoroutier (Vinci)</span>
      </div>
      <div id="peage-section">
        <label class="label">Montant peage aller-retour (euros)</label>
        <input type="number" id="peage-montant" placeholder="ex : 28.60" min="0" step="0.01" style="max-width:180px;">
      </div>
    </div>

    <div class="section">
      <label class="label">Arrets clients <span style="color:#aaa;font-size:11px;text-transform:none; font-weight:400;">(agence &rarr; arrets &rarr; retour agence)</span></label>
      <div class="stop-list" id="stop-list"></div>
      <button class="btn-sm" onclick="addStop()">+ Ajouter un arret</button>
    </div>

    <div class="section">
      <div style="display:flex; gap:8px; margin-bottom:6px;">
        <button class="btn-sm" onclick="resetForm()" style="flex:1; justify-content:center;">Reinitialiser</button>
      </div>
      <button class="btn-primary" onclick="calculer()">Calculer le devis</button>
    </div>

    <div class="section">
      <div class="loading" id="loading">Calcul en cours...</div>
      <div class="error" id="error"></div>
      <div class="result-card" id="result-card">
        <div class="result-grid">
          <div class="metric">
            <div class="metric-label">Distance</div>
            <div class="metric-value" id="res-distance">--</div>
          </div>
          <div class="metric">
            <div class="metric-label">Tarif/km</div>
            <div class="metric-value" id="res-tarif">--</div>
          </div>
          <div class="metric">
            <div class="metric-label">Montant km</div>
            <div class="metric-value" id="res-km-total">--</div>
          </div>
          <div class="metric">
            <div class="metric-label">Peage</div>
            <div class="metric-value" id="res-peage">--</div>
          </div>
          <div class="metric" style="grid-column: span 2; background:#fff8e6; border-color:#f0d080;">
            <div class="metric-label" style="color:#9a6000;">Carburant estimé</div>
            <div style="display:flex; align-items:baseline; gap:12px; flex-wrap:wrap;">
              <span class="metric-value" id="res-carburant" style="color:#9a6000;">--</span>
              <span style="font-size:12px; color:#aaa;" id="res-carburant-detail"></span>
            </div>
          </div>
        </div>
        <div class="total-row">
          <span class="total-label">Total HT</span>
          <span class="total-value" id="res-total">--</span>
        </div>
      </div>
    </div>

  </div>

  <!-- CARTE DROITE -->
  <div class="map-side">
    <div id="map"></div>
    <div class="map-info" id="map-info"></div>
  </div>
</div>

<script>
// Donnees agences
var AGENCES = {
  'Pommérieux, Mayenne, France':                    { label: 'Agence Laval  |  Depart : Pommerieux (53)' },
  'Vigneux-de-Bretagne, Loire-Atlantique, France':  { label: 'Agence Nantes  |  Depart : Vigneux-de-Bretagne (44)' },
  'Brest, Finistère, France':                       { label: 'Agence Brest  |  Depart : Brest (29)' }
};

// Donnees clients
var CLIENTS = {
  'standard': { tarif: 0.95, peageInclus: false, label: 'Client standard  |  0,95 euro/km  |  Peage en sus', cls: 'standard' },
  'loxam':    { tarif: 1.25, peageInclus: true,  label: 'Loxam  |  1,25 euro/km  |  Peage inclus',            cls: 'loxam'    }
};

function onAgenceChange() {
  var val = document.getElementById('agence').value;
  var info = document.getElementById('agence-info');
  if (val && AGENCES[val]) {
    info.textContent = AGENCES[val].label;
    info.style.display = 'block';
  } else {
    info.style.display = 'none';
  }
}

function onClientChange() {
  var val = document.getElementById('client').value;
  var client = CLIENTS[val];
  var info = document.getElementById('client-info');
  var peageWrapper = document.getElementById('peage-wrapper');
  info.textContent = client.label;
  info.className = 'client-info ' + client.cls;
  info.style.display = 'block';
  // Masquer le peage si inclus
  if (client.peageInclus) {
    peageWrapper.style.display = 'none';
    document.getElementById('peage-toggle').checked = false;
    document.getElementById('peage-section').style.display = 'none';
  } else {
    peageWrapper.style.display = 'block';
  }
}

function togglePeage() {
  var on = document.getElementById('peage-toggle').checked;
  document.getElementById('peage-section').style.display = on ? 'block' : 'none';
}

// Init carte
var map = L.map('map').setView([47.5, -1.8], 7);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '&copy; OpenStreetMap contributors', maxZoom: 18
}).addTo(map);

var routeLayer = null;
var markersLayer = L.layerGroup().addTo(map);
var stops = [];

function addStop() {
  var id = Date.now();
  stops.push(id);
  renderStops();
}

function removeStop(id) {
  stops = stops.filter(function(s) { return s !== id; });
  renderStops();
}

function renderStops() {
  var list = document.getElementById('stop-list');
  list.innerHTML = '';
  stops.forEach(function(id, i) {
    var wrap = document.createElement('div');
    wrap.className = 'stop-input-wrap';
    wrap.innerHTML =
      '<div class="stop-num">' + (i + 1) + '</div>' +
      '<input type="text" id="stop-' + id + '" placeholder="Ville ou adresse du client" style="flex:1;">' +
      '<button class="btn-del" onclick="removeStop(' + id + ')" title="Supprimer">&times;</button>';
    list.appendChild(wrap);
  });
}

async function geocode(address) {
  var url = 'https://nominatim.openstreetmap.org/search?q=' + encodeURIComponent(address) + '&format=json&limit=1&countrycodes=fr';
  var res = await fetch(url, { headers: { 'Accept-Language': 'fr' } });
  var data = await res.json();
  if (!data.length) throw new Error('Adresse introuvable : "' + address + '"');
  return { lat: parseFloat(data[0].lat), lon: parseFloat(data[0].lon), label: data[0].display_name.split(',').slice(0,2).join(', ') };
}

async function getRoute(coords) {
  var coordStr = coords.map(function(c) { return c.lon + ',' + c.lat; }).join(';');
  var url = 'https://router.project-osrm.org/route/v1/driving/' + coordStr + '?overview=full&geometries=geojson';
  var res = await fetch(url);
  var data = await res.json();
  if (data.code !== 'Ok') throw new Error('Impossible de calculer l\'itineraire');
  return data.routes[0];
}

function showError(msg) {
  var el = document.getElementById('error');
  el.textContent = msg;
  el.style.display = 'block';
  document.getElementById('loading').style.display = 'none';
  document.getElementById('result-card').style.display = 'none';
}

function drawRoute(geojson, coords, labels) {
  if (routeLayer) { map.removeLayer(routeLayer); }
  markersLayer.clearLayers();

  routeLayer = L.geoJSON(geojson, {
    style: { color: '#185FA5', weight: 5, opacity: 0.85 }
  }).addTo(map);

  coords.forEach(function(c, i) {
    var color = (i === 0) ? '#27ae60' : (i === coords.length - 1) ? '#c0392b' : '#185FA5';
    var size = (i === 0 || i === coords.length - 1) ? 14 : 11;
    var icon = L.divIcon({
      className: '',
      html: '<div style="background:' + color + ';border:2.5px solid #fff;border-radius:50%;width:' + size + 'px;height:' + size + 'px;box-shadow:0 1px 5px rgba(0,0,0,0.4);"></div>',
      iconSize: [size, size], iconAnchor: [size/2, size/2]
    });
    L.marker([c.lat, c.lon], { icon: icon }).addTo(markersLayer).bindPopup('<b>' + labels[i] + '</b>');
  });

  map.fitBounds(routeLayer.getBounds(), { padding: [40, 40] });
}

async function calculer() {
  document.getElementById('error').style.display = 'none';
  document.getElementById('result-card').style.display = 'none';

  var agence = document.getElementById('agence').value;
  if (!agence) { showError('Veuillez selectionner une agence de depart.'); return; }

  var clientKey = document.getElementById('client').value;
  var client = CLIENTS[clientKey];

  var stopAddresses = stops.map(function(id) {
    var el = document.getElementById('stop-' + id);
    return el ? el.value.trim() : '';
  }).filter(Boolean);

  if (!stopAddresses.length) { showError('Ajoutez au moins un arret client.'); return; }

  document.getElementById('loading').style.display = 'block';

  try {
    var allAddresses = [agence].concat(stopAddresses).concat([agence]);
    var coords = [];
    var labels = [];

    for (var i = 0; i < allAddresses.length; i++) {
      var c = await geocode(allAddresses[i]);
      coords.push(c);
      if (i === 0) labels.push('Depart agence : ' + c.label);
      else if (i === allAddresses.length - 1) labels.push('Retour agence');
      else labels.push('Arret ' + i + ' : ' + c.label);
      await new Promise(function(r) { setTimeout(r, 350); });
    }

    var route = await getRoute(coords);
    var distKm = route.distance / 1000;
    var dureeMin = Math.round(route.duration / 60);

    var montantKm = distKm * client.tarif;
    var peageVal = 0;
    if (!client.peageInclus && document.getElementById('peage-toggle').checked) {
      peageVal = parseFloat(document.getElementById('peage-montant').value) || 0;
    }
    var conso = parseFloat(document.getElementById('conso').value) || 9;
    var prixCarburant = parseFloat(document.getElementById('prix-carburant').value) || 1.95;
    var litresConsommes = distKm * conso / 100;
    var montantCarburant = litresConsommes * prixCarburant;
    var total = montantKm + peageVal;

    document.getElementById('res-distance').textContent = distKm.toFixed(1) + ' km';
    document.getElementById('res-tarif').textContent = client.tarif.toFixed(2).replace('.', ',') + ' E/km';
    document.getElementById('res-km-total').textContent = montantKm.toFixed(2).replace('.', ',') + ' E';
    document.getElementById('res-peage').textContent = client.peageInclus ? 'Inclus' : (peageVal > 0 ? peageVal.toFixed(2).replace('.', ',') + ' E' : '--');
    document.getElementById('res-carburant').textContent = montantCarburant.toFixed(2).replace('.', ',') + ' €';
    document.getElementById('res-carburant-detail').textContent = litresConsommes.toFixed(1) + ' L  ·  ' + conso + ' L/100  ·  ' + prixCarburant.toFixed(2).replace('.', ',') + ' €/L';
    document.getElementById('res-total').textContent = total.toFixed(2).replace('.', ',') + ' E';

    document.getElementById('loading').style.display = 'none';
    document.getElementById('result-card').style.display = 'block';

    var h = Math.floor(dureeMin / 60);
    var m = dureeMin % 60;
    var dureeStr = h > 0 ? h + 'h' + (m > 0 ? m + 'min' : '') : m + 'min';
    var infoEl = document.getElementById('map-info');
    infoEl.textContent = 'Itineraire  |  ' + distKm.toFixed(1) + ' km  |  Duree estimee : ' + dureeStr;
    infoEl.style.display = 'block';

    drawRoute(route.geometry, coords, labels);

  } catch(e) {
    showError(e.message || 'Une erreur est survenue lors du calcul.');
  }
}

function resetForm() {
  document.getElementById('agence').value = '';
  document.getElementById('agence-info').style.display = 'none';
  document.getElementById('client').value = 'standard';
  document.getElementById('client-info').style.display = 'none';
  document.getElementById('peage-wrapper').style.display = 'block';
  document.getElementById('peage-toggle').checked = false;
  document.getElementById('peage-section').style.display = 'none';
  document.getElementById('peage-montant').value = '';
  document.getElementById('conso').value = '9';
  document.getElementById('prix-carburant').value = '1.95';
  document.getElementById('result-card').style.display = 'none';
  document.getElementById('error').style.display = 'none';
  document.getElementById('loading').style.display = 'none';
  document.getElementById('map-info').style.display = 'none';
  stops = [];
  renderStops();
  if (routeLayer) { map.removeLayer(routeLayer); routeLayer = null; }
  markersLayer.clearLayers();
  map.setView([47.5, -1.8], 7);
}

// Init
onClientChange();
addStop();
</script>
</body>
</html>
